name: Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: build/bin/squish.exe
            asset_name: squish-windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: build/bin/squish.app
            asset_name: squish-macos-universal.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: build/bin/squish
            asset_name: squish-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Download bundled FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $bin = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $dir = Split-Path $bin.FullName
          Copy-Item "$dir\ffmpeg.exe" resources\ffmpeg\windows\ffmpeg.exe -Force
          Copy-Item "$dir\ffprobe.exe" resources\ffmpeg\windows\ffprobe.exe -Force

      - name: Download bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p ffmpeg_extract
          tar -xf ffmpeg.tar.xz -C ffmpeg_extract --strip-components=1
          cp ffmpeg_extract/ffmpeg resources/ffmpeg/linux/ffmpeg
          cp ffmpeg_extract/ffprobe resources/ffmpeg/linux/ffprobe
          chmod +x resources/ffmpeg/linux/ffmpeg resources/ffmpeg/linux/ffprobe

      - name: Download bundled FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
          curl -L -o ffprobe.zip https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
          unzip -o ffmpeg.zip -d ffmpeg_extract
          unzip -o ffprobe.zip -d ffprobe_extract
          cp ffmpeg_extract/ffmpeg resources/ffmpeg/darwin/ffmpeg
          cp ffprobe_extract/ffprobe resources/ffmpeg/darwin/ffprobe
          chmod +x resources/ffmpeg/darwin/ffmpeg resources/ffmpeg/darwin/ffprobe

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.asset_name }} squish.app

      - name: Rename Windows/Linux binary
        if: runner.os != 'macOS'
        shell: bash
        run: cp "${{ matrix.artifact }}" "${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
